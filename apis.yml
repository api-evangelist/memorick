name: Memorick
description: >-
  Memorick is a 500 Global-backed company operating a live web application at
  memorick.com. Based on its observable application surface, it is a destination
  photography booking platform connecting customers with photographers across
  destinations, handling packages, orders, reviews, coupons, and messaging. The
  product is built on Laravel (Inertia.js single-page front end) and exposes an
  OAuth2 authorization server via Laravel Passport (authorize/token/clients/scopes
  plus personal access tokens), Sanctum first-party session auth, and optional
  two-factor authentication. It publishes no public API documentation, OpenAPI
  definition, SDKs, or developer portal at this time; the /api/* routes back the
  first-party application and are authentication-gated. This profile was enriched
  from live probing of the public surface.
